# -------------------------------
# build-system
# -------------------------------
[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

# -------------------------------
# project (PEP 621 metadata)
# -------------------------------
[project]
name = "internbootcamp"
version = "2.0.0"
description = "internbootcamp"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "internbootcamp v2.0.0 Team"}
]

dependencies = [
    "aiohttp>=3.13.2",
    "datasets>=4.4.1",
    "fastapi>=0.123.10",
    "jsonlines>=4.0.0",
    "matplotlib>=3.10.7",
    "networkx>=3.4.2",
    # Add dependencies as needed
    "numpy<2.0.0",
    "openai>=2.9.0",
    "pyyaml>=6.0.3",
    "starlette>=0.50.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "transformers>=4.57.3",
    "uvicorn>=0.38.0",
    "verl @ git+https://github.com/volcengine/verl.git@main",
    "vllm>=0.12.0",
]

# -------------------------------
# tool.setuptools - Additional config
# -------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

